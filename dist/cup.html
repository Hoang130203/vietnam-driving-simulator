<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='21' font-size='21'%3E🏁%3C/text%3E%3C/svg%3E"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17171a"><title>Tay Lái Việt • Cúp Bánh Mì</title><link rel="stylesheet" href="race.css"><script>if(/^#(?:practice\/|exam\/|home$)/.test(location.hash))location.replace('hall.html'+location.hash)</script></head>
<body class="arcade" data-phase="grid"><canvas id="world" aria-label="Đường đua 3D"></canvas>
<header><a class="brand" href="./">TAY LÁI <b>VIỆT</b></a><div class="tools"><button id="camera">Góc nhìn</button><button id="sound">Bật âm</button><button id="pause" hidden>Tạm dừng</button></div></header>
<section id="grid" class="grid"><div class="gridcopy"><small>GIẢI ĐUA ĐƯỜNG KÍN</small><h1>CÚP<br><i>BÁNH MÌ</i></h1><p>Ba đối thủ, một ổ đặc biệt. Ai về nhất được thêm chả.</p><label for="garage">Xe của bạn</label><select id="garage"><option value="supercar">Siêu xe động cơ giữa</option><option value="gt">GT cổ điển</option><option value="rally">Rally thể thao</option></select><label for="route">Chọn đường đua</label><select id="route"><option value="river">Ven sông · 2,24 km</option><option value="pass">Đèo trà · 2,48 km</option></select><button id="launch" class="hot">Vào vạch xuất phát</button><div class="keys">W A S D / phím mũi tên để lái · Shift tăng tốc</div><a href="hall.html">Đến sân tập &amp; thi thử</a> · <a href="./">Xuyên Việt</a></div></section>
<div class="hud" hidden id="hud"><div class="rank"><small>VỊ TRÍ</small><strong id="rank"></strong></div><div class="chrono"><small>THỜI GIAN</small><strong id="time"></strong></div><canvas id="map" width="175" height="121" aria-label="Bản đồ đường đua"></canvas><div class="telemetry"><strong id="speed">0</strong> km/h<div><label>Thân xe <meter id="hp" min="0" max="100" value="100"></meter></label><label>Nitro <meter id="nitro" min="0" max="100" value="100"></meter></label></div></div><div class="track"><span id="routeName"></span><span id="distance"></span><progress id="progress"></progress></div></div>
<output id="callout" aria-live="polite"></output><output id="count"></output><div class="touch" hidden id="touch"><div><button data-key="a" aria-label="Rẽ trái">◀</button><button data-key="d" aria-label="Rẽ phải">▶</button></div><div><button data-key="shift">Nitro</button><button data-key="s">Phanh</button><button data-key="w">Ga</button></div></div>
<dialog id="pit"><small>GARA CHÚ TƯ</small><h2 id="remark"></h2><p id="prompt"></p><img id="pitImage" hidden alt=""><div id="choices"></div><p id="reply" role="status"></p><button id="repair" class="hot" hidden>Nhận xe và đua tiếp</button></dialog>
<dialog id="rest"><small>ĐƯỜNG ĐUA</small><h2>Tạm nghỉ máy</h2><button id="resume" class="hot">Đua tiếp</button><a href="./">Về vạch xuất phát</a></dialog>
<dialog id="finish"><small>CÚP BÁNH MÌ</small><h2 id="podium"></h2><p id="result"></p><button id="again" class="hot">Đua lại</button><a id="next">Đổi đường đua</a></dialog>
<script src="three.min.js"></script><script src="traffic/loader.js"></script><script src="cabin.js"></script><script src="audio.js"></script><script src="bank.js"></script><script src="roadside.js"></script><script src="road-exam.js"></script><script src="pit-quiz.js"></script><script src="race.js"></script></body></html>
