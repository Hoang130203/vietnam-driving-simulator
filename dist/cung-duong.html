<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12241f">
  <link rel="icon" href="data:,">
  <title>Cung đường nổi tiếng · ViVu3D</title>
  <link rel="stylesheet" href="pass-atlas.css">
</head>
<body>
  <header>
    <a class="brand" href="./" aria-label="ViVu3D, trang chính">ViVu<b>3D</b></a>
    <nav aria-label="Chế độ chơi"><a href="./">Xuyên Việt</a><a href="cup.html">Đua Cúp</a><a href="hall.html">Sân tập</a></nav>
  </header>
  <main>
    <h1>Cung đường nổi tiếng</h1>
    <nav id="passChoices" aria-label="Chọn cung đường"></nav>
    <article aria-labelledby="passTitle">
      <figure>
        <img id="plate" width="1000" height="620" alt="">
        <figcaption><span><i class="startMark"></i>Xuất phát</span><span><i class="finishMark"></i>Về đích</span></figcaption>
      </figure>
      <div class="notes">
        <p id="region"></p><h2 id="passTitle"></h2><p id="description"></p>
        <div class="profile">
          <div class="chartLabel"><strong>Biên dạng dốc</strong><span>Chặng trong game</span></div>
          <canvas id="elevation" width="640" height="92" role="img" aria-label="Biểu đồ độ cao tương đối theo chiều lái"></canvas>
          <dl><div><dt>Chiều dài</dt><dd id="length"></dd></div><div><dt>Tổng leo dốc</dt><dd id="ascent"></dd></div></dl>
        </div>
        <label class="lightChoice">Ánh sáng mô phỏng
          <select id="light"><option value="morning">Nắng sớm</option><option value="late">Chiều muộn</option><option value="local">Giờ địa phương</option></select>
        </label>
        <div class="actions"><a id="explore">Lái tự do</a><a id="race">Đua chặng này</a></div>
      </div>
    </article>
    <footer><span><a href="streetscape/CREDITS.txt">Địa hình Mapzen / USGS · Thảm phủ ESA WorldCover 2021</a></span><a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a></footer>
  </main>
  <script src="mountain-stages.js"></script>
  <script src="scenic-passes.js"></script>
  <script src="pass-atlas.js"></script>
</body>
</html>
