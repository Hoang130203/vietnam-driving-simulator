<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sân sát hạch hạng B</title><link rel="stylesheet" href="yard.css"><link rel="stylesheet" href="lesson-cockpit.css"></head><body class="lessonYard">
<main><header><div><small>THỰC HÀNH HẠNG B</small><h1>Sân sa hình</h1></div><div id="stats"><b id="points">100 điểm</b><span id="clock">18:00</span></div></header>
<section id="view"><canvas id="world" aria-label="Sân sát hạch 3D"></canvas><div id="badge">Bài 1 / 11</div><button id="camera" class="hud">Đổi góc nhìn</button><canvas id="map" width="190" height="138" aria-label="Sơ đồ sân và vị trí xe"></canvas><div id="meters"><b id="speed">0</b> km/h <em id="gear">1</em></div></section>
<section class="panel"><div class="intro"><label for="pick">Bài thực hành</label><select id="pick"></select><h2 id="name"></h2><p id="guide"></p><strong id="cue" aria-live="polite"></strong></div><div class="actions"><button id="go">Bắt đầu</button><button id="again">Làm lại</button></div></section>
<section class="controls" aria-label="Điều khiển xe"><div class="lessonPedals"><button data-key="arrowleft">← Trái</button><button data-key="arrowright">Phải →</button><button data-key="arrowdown">↓ Phanh</button><button data-key="arrowup">↑ Ga</button></div><div class="lessonSwitches"><button data-act="shift">G · Số 1/2</button><button data-act="reverse">R · Số lùi</button><button data-act="left">Q · Báo trái</button><button data-act="right">E · Báo phải</button><button data-act="hazard">H · Cảnh báo</button><button data-act="belt">B · Dây an toàn</button></div></section>
<footer><span id="modeLabel"></span><span>Điểm luyện tập do trò chơi tính. <a href="https://bocongan.gov.vn/KND/vb/vbqp/Lists/VBQP/Attachments/2822/Thong%20tu%2012.2025.TT.BCA.pdf" target="_blank" rel="noopener">Quy trình gốc · Phụ lục IV</a></span></footer></main>
<script src="cockpit-settings.js"></script><script src="drive-input.js"></script><script src="three.min.js"></script><script src="driving-graphics.js"></script><script src="yard.js"></script></body></html>
