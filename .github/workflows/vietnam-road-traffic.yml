name: Build Vietnam road traffic data
on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install osmium==4.3.2
      - name: Download the road graph's OSM snapshot
        run: |
          snapshot=$(jq -r '.osmTimestamp[:10] | split("-") | join("") | .[2:]' dist/vn-roads/index.json)
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/vietnam.osm.pbf" "https://download.geofabrik.de/asia/vietnam/vietnam-${snapshot}.osm.pbf"
      - name: Match controls and attributes to the national road graph
        run: python tools/build_vn_traffic.py "$RUNNER_TEMP/vietnam.osm.pbf" dist/vn-roads "$RUNNER_TEMP/vn-traffic"
      - uses: actions/upload-artifact@v4
        with:
          name: vn-traffic
          path: ${{ runner.temp }}/vn-traffic/
          compression-level: 0
          retention-days: 1
